name: E2E Tests

on:
  pull_request:
  workflow_dispatch:

env:
  DIFFUSION_TESTS_REPO: https://github.com/Polar-Team/diffusion-ansible-tests-role.git

jobs:
  e2e:
    name: E2E Tests (${{ matrix.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # Required for OIDC token exchange with AWS, GCP, and Yandex Cloud
    env:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      YC_SA_ID: ${{ secrets.YC_SA_ID }}
      YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux distros – smoke tests execute inside a Docker container of the
          # target distro. The host docker binary is bind-mounted so diffusion
          # can spawn the molecule container via the host Docker socket.
          - os: ubuntu2204
            container: ubuntu:22.04
          - os: ubuntu2404
            container: ubuntu:24.04
          - os: debian12
            container: debian:12
          - os: debian13
            container: debian:trixie
          - os: fedora43
            container: fedora:43
          - os: fedora42
            container: fedora:42
          - os: almalinux9
            container: almalinux:9
          - os: almalinux10
            container: almalinux:10
          - os: archlinux
            container: archlinux:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Cloud CLI authentication (OIDC) ──────────────────────────────────
      # OIDC eliminates long-lived static credentials. GitHub's identity
      # provider token is exchanged for short-lived cloud tokens at runtime.
      # Required GitHub secrets:
      #   AWS:  AWS_ROLE_ARN, AWS_DEFAULT_REGION
      #   GCP:  GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT
      #   YC:   YC_SA_ID
      # Each step is skipped when its secret is absent (forks / unconfigured).

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Authenticate to Google Cloud (OIDC)
        id: gcp-auth
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && env.GCP_SERVICE_ACCOUNT != ''
        uses: google-github-actions/auth@v2.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Yandex Cloud (OIDC)
        id: yc-iam
        if: env.YC_SA_ID != ''
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ secrets.YC_SA_ID }}

      - name: Export Yandex Cloud IAM token
        if: steps.yc-iam.outputs.token != ''
        run: echo "YC_IAM_TOKEN=${{ steps.yc-iam.outputs.token }}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build diffusion
        run: make build

      - name: Run unit tests
        run: go test -v ./...

      # ── Docker setup ─────────────────────────────────────────────────────

      - name: Start Docker
        run: |
          sudo systemctl start docker
          docker version
          docker info

      # ── Smoke tests ───────────────────────────────────────────────────────

      - name: Clone diffusion tests repo
        run: git clone ${{ env.DIFFUSION_TESTS_REPO }} "$GITHUB_WORKSPACE/diffusion_tests"

      - name: Run smoke tests
        run: |
          DOCKER_BIN=$(which docker)
          docker run --rm \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$DOCKER_BIN:/usr/local/bin/docker" \
            ${GOOGLE_APPLICATION_CREDENTIALS:+-v "$GOOGLE_APPLICATION_CREDENTIALS:$GOOGLE_APPLICATION_CREDENTIALS"} \
            -w "$GITHUB_WORKSPACE/diffusion_tests" \
            -e WORKSPACE="$GITHUB_WORKSPACE" \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_DEFAULT_REGION \
            ${GOOGLE_APPLICATION_CREDENTIALS:+-e GOOGLE_APPLICATION_CREDENTIALS} \
            ${YC_IAM_TOKEN:+-e YC_IAM_TOKEN} \
            -e GIT_CONFIG_COUNT=2 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE/diffusion_tests" \
            -e GIT_CONFIG_KEY_1=safe.directory \
            -e GIT_CONFIG_VALUE_1="$GITHUB_WORKSPACE" \
            "${{ matrix.container }}" \
            sh -c '
              set -e

              DIFFUSION="${WORKSPACE}/bin/diffusion"

              # Install git (required by diffusion --ci mode to get git remote URL).
              if ! command -v git >/dev/null 2>&1; then
                if command -v apt-get >/dev/null 2>&1; then
                  DEBIAN_FRONTEND=noninteractive apt-get update -qq && apt-get install -y -qq git
                elif command -v dnf >/dev/null 2>&1; then
                  dnf install -y -q git
                elif command -v pacman >/dev/null 2>&1; then
                  pacman -Sy --noconfirm git
                elif command -v apk >/dev/null 2>&1; then
                  apk add --no-cache git
                else
                  echo "ERROR: no supported package manager found to install git" && exit 1
                fi
              fi
              git --version

              echo "=========================================="
              echo "Running deps smoke tests on ${{ matrix.os }}..."
              echo "=========================================="
              # First check is expected to fail before lock+sync — ignore exit code
              $DIFFUSION deps check || echo "deps check failed before lock+sync (expected)"
              $DIFFUSION deps lock
              $DIFFUSION deps sync
              $DIFFUSION deps check

              echo "=========================================="
              echo "Running role subcommand smoke tests on ${{ matrix.os }}..."
              echo "=========================================="
              $DIFFUSION role
              $DIFFUSION role add-collection general --namespace community
              $DIFFUSION role add-collection posix --namespace ansible
              $DIFFUSION deps sync
              $DIFFUSION deps check
              $DIFFUSION role remove-collection posix --namespace ansible
              $DIFFUSION deps sync
              $DIFFUSION role add-role git_role --src https://github.com/geerlingguy/ansible-role-git.git
              $DIFFUSION deps sync
              $DIFFUSION deps check
              $DIFFUSION role remove-role git_role
              $DIFFUSION deps sync
              $DIFFUSION deps check

              echo "=========================================="
              echo "Running molecule smoke tests on ${{ matrix.os }}..."
              echo "=========================================="
              $DIFFUSION molecule --ci
              $DIFFUSION molecule --verify --ci
              $DIFFUSION molecule --idempotence --ci
              $DIFFUSION molecule --lint --ci
              $DIFFUSION molecule --verify --tag ports --ci

              echo "=========================================="
              echo "Running cache/artifact smoke tests on ${{ matrix.os }}..."
              echo "=========================================="
              $DIFFUSION cache enable
              $DIFFUSION cache status
              $DIFFUSION artifact list

              echo "=========================================="
              echo "Running docs smoke tests on ${{ matrix.os }}..."
              echo "=========================================="

              # Create a fixture role for docs generation
              DOCS_FIXTURE="/tmp/diffusion-docs-fixture"
              mkdir -p "$DOCS_FIXTURE/defaults"
              mkdir -p "$DOCS_FIXTURE/vars"
              mkdir -p "$DOCS_FIXTURE/templates"
              mkdir -p "$DOCS_FIXTURE/tasks"

              # defaults/main.yml — typed vars, required vars, multi-line
              printf '%s\n' \
                '---' \
                '#—| string' \
                'app_name: "my-app"' \
                '#—? The application name' \
                '' \
                '#—| int' \
                'app_port: 8080' \
                '#—? TCP port for the application' \
                '' \
                '#—| list' \
                'packages:' \
                '  - nginx' \
                '  - curl' \
                '#—? System packages to install' \
                '' \
                '#—| string' \
                '#—! db_password' \
                '#—? Database password (required, no default)' \
                '' \
                '#—| string' \
                '#—! api_key' \
                '#—? API key for external service' \
                > "$DOCS_FIXTURE/defaults/main.yml"

              # vars/main.yml — duplicate var (should be flagged)
              printf '%s\n' \
                '---' \
                '#—| string' \
                'app_name: "overridden"' \
                '#—? Should be flagged as duplicate' \
                > "$DOCS_FIXTURE/vars/main.yml"

              # templates/app.conf.j2 — Jinja2 with for-loops
              printf '%s\n' \
                '{% for pkg in packages %}' \
                'install {{ pkg }}' \
                '{% endfor %}' \
                '' \
                '{% set local_var = "computed" %}' \
                'server_name {{ app_name }};' \
                'listen {{ app_port }};' \
                'backend {{ backend_url }};' \
                'local {{ local_var }};' \
                '' \
                '{% for host in server_hosts %}' \
                '  upstream {{ host }};' \
                '{% endfor %}' \
                > "$DOCS_FIXTURE/templates/app.conf.j2"

              # tasks/main.yml — with internal vars (should be excluded)
              printf '%s\n' \
                '---' \
                '- name: Use internal var' \
                '  debug:' \
                '    msg: "{{ _internal_var }} {{ log_level }}"' \
                > "$DOCS_FIXTURE/tasks/main.yml"

              # Create initial README.md
              printf '%s\n' \
                '# Test Role' \
                '' \
                'A test role for docs generation.' \
                > "$DOCS_FIXTURE/README.md"

              # Test 1: dry-run should produce output without modifying README
              echo "--- docs test 1: dry-run mode ---"
              DRY_OUTPUT=$($DIFFUSION docs --path "$DOCS_FIXTURE" --dry-run 2>/dev/null)

              # Verify table header present
              echo "$DRY_OUTPUT" | grep -q "| Variable | Type | Default | Source | Description |" \
                || { echo "FAIL: table header not found in dry-run output"; exit 1; }

              # Verify required variable shows **required**
              echo "$DRY_OUTPUT" | grep -q "\\*\\*required\\*\\*" \
                || { echo "FAIL: **required** marker not found for required vars"; exit 1; }

              # Verify duplicate is flagged
              echo "$DRY_OUTPUT" | grep -q "⚠️" \
                || { echo "FAIL: duplicate warning not found"; exit 1; }

              # Verify README was NOT modified (dry-run)
              grep -q "begin role_variables" "$DOCS_FIXTURE/README.md" \
                && { echo "FAIL: README was modified during dry-run"; exit 1; }
              echo "docs test 1 passed (dry-run)"

              # Test 2: actual docs generation
              echo "--- docs test 2: docs generation ---"
              $DIFFUSION docs --path "$DOCS_FIXTURE"

              # Verify README was updated with markers
              grep -q "<!-- begin role_variables -->" "$DOCS_FIXTURE/README.md" \
                || { echo "FAIL: begin marker not found in README"; exit 1; }
              grep -q "<!-- end role_variables -->" "$DOCS_FIXTURE/README.md" \
                || { echo "FAIL: end marker not found in README"; exit 1; }

              # Verify typed variables from defaults appear
              grep -q "app_name" "$DOCS_FIXTURE/README.md" \
                || { echo "FAIL: app_name not in README"; exit 1; }
              grep -q "app_port" "$DOCS_FIXTURE/README.md" \
                || { echo "FAIL: app_port not in README"; exit 1; }
              grep -q "packages" "$DOCS_FIXTURE/README.md" \
                || { echo "FAIL: packages not in README"; exit 1; }

              # Verify required variables
              grep -q "db_password" "$DOCS_FIXTURE/README.md" \
                || { echo "FAIL: db_password not in README"; exit 1; }
              grep -q "api_key" "$DOCS_FIXTURE/README.md" \
                || { echo "FAIL: api_key not in README"; exit 1; }
              grep -q "\\*\\*required\\*\\*" "$DOCS_FIXTURE/README.md" \
                || { echo "FAIL: **required** not in README"; exit 1; }

              # Verify for-loop source variables are included
              grep -q "server_hosts" "$DOCS_FIXTURE/README.md" \
                || { echo "FAIL: server_hosts (for-loop source) not in README"; exit 1; }
              grep -q "backend_url" "$DOCS_FIXTURE/README.md" \
                || { echo "FAIL: backend_url not in README"; exit 1; }

              # Verify for-loop iterators are NOT included
              grep -q "| \`pkg\`" "$DOCS_FIXTURE/README.md" \
                && { echo "FAIL: pkg (for-loop iterator) should NOT be in README"; exit 1; }
              grep -q "| \`host\`" "$DOCS_FIXTURE/README.md" \
                && { echo "FAIL: host (for-loop iterator) should NOT be in README"; exit 1; }

              # Verify {% set %} local vars are NOT included
              grep -q "| \`local_var\`" "$DOCS_FIXTURE/README.md" \
                && { echo "FAIL: local_var (set var) should NOT be in README"; exit 1; }

              # Verify underscore-prefixed vars are NOT included
              grep -q "| \`_internal_var\`" "$DOCS_FIXTURE/README.md" \
                && { echo "FAIL: _internal_var (excluded prefix) should NOT be in README"; exit 1; }

              # Verify source includes file path
              grep -q "defaults/main.yml" "$DOCS_FIXTURE/README.md" \
                || { echo "FAIL: source file path defaults/main.yml not in README"; exit 1; }

              # Verify duplicate detection
              grep -q "⚠️" "$DOCS_FIXTURE/README.md" \
                || { echo "FAIL: duplicate warning marker not in README"; exit 1; }
              echo "docs test 2 passed (generation)"

              # Test 3: idempotency — running again should produce same result
              echo "--- docs test 3: idempotency ---"
              cp "$DOCS_FIXTURE/README.md" /tmp/readme_first.md
              $DIFFUSION docs --path "$DOCS_FIXTURE"
              diff "$DOCS_FIXTURE/README.md" /tmp/readme_first.md \
                || { echo "FAIL: docs generation is not idempotent"; exit 1; }
              echo "docs test 3 passed (idempotency)"

              # Test 4: marker replacement — existing markers get updated
              echo "--- docs test 4: marker replacement ---"
              printf '%s\n' \
                '# Updated Role' \
                '' \
                '<!-- begin role_variables -->' \
                'OLD CONTENT HERE' \
                '<!-- end role_variables -->' \
                '' \
                '## License' \
                'MIT' \
                > "$DOCS_FIXTURE/README.md"

              $DIFFUSION docs --path "$DOCS_FIXTURE"

              # Old content should be gone
              grep -q "OLD CONTENT HERE" "$DOCS_FIXTURE/README.md" \
                && { echo "FAIL: old content between markers was not replaced"; exit 1; }

              # New content should exist
              grep -q "app_name" "$DOCS_FIXTURE/README.md" \
                || { echo "FAIL: new content not generated after marker replacement"; exit 1; }

              # Content outside markers should be preserved
              grep -q "## License" "$DOCS_FIXTURE/README.md" \
                || { echo "FAIL: content after markers was lost"; exit 1; }
              grep -q "MIT" "$DOCS_FIXTURE/README.md" \
                || { echo "FAIL: license text after markers was lost"; exit 1; }
              echo "docs test 4 passed (marker replacement)"

              echo "All docs smoke tests passed!"

              echo "=========================================="
              echo "Running deploy smoke tests on ${{ matrix.os }}..."
              echo "=========================================="

              # Create a minimal local git repo to use as a role source.
              DEPLOY_FIXTURE="/tmp/diffusion-deploy-fixture"
              mkdir -p "$DEPLOY_FIXTURE/meta"

              printf '%s\n' \
                'version: "1.0"' \
                'generated: "2024-01-01T00:00:00Z"' \
                'hash: "ci-deploy-fixture"' \
                'python:' \
                '  min: "3.11"' \
                '  max: "3.13"' \
                '  pinned: "3.13"' \
                'roles: []' \
                'collections: []' \
                'tools: []' \
                > "$DEPLOY_FIXTURE/diffusion.lock"

              printf '%s\n' \
                'galaxy_info:' \
                '  role_name: deploy_test' \
                '  namespace: ci' \
                '  author: CI' \
                '  description: Deploy smoke test fixture' \
                '  license: MIT' \
                '  min_ansible_version: "2.10"' \
                '  platforms: []' \
                'collections: []' \
                > "$DEPLOY_FIXTURE/meta/main.yml"

              git -C "$DEPLOY_FIXTURE" init
              git -C "$DEPLOY_FIXTURE" config user.email "ci@ci.com"
              git -C "$DEPLOY_FIXTURE" config user.name "CI"
              git -C "$DEPLOY_FIXTURE" add .
              git -C "$DEPLOY_FIXTURE" commit -m "init"
              git -C "$DEPLOY_FIXTURE" branch -M main

              printf '%s\n' \
                '---' \
                '- name: diffusion deploy smoke test' \
                '  hosts: all' \
                '  gather_facts: false' \
                '  tasks:' \
                '    - name: smoke check' \
                '      ansible.builtin.debug:' \
                '        msg: diffusion deploy E2E test passed' \
                > /tmp/deploy-test.yml

              ROLE_SOURCE="scm=git,version=main,url=file://${DEPLOY_FIXTURE}"

              # 1. Single role source + explicit playbook
              $DIFFUSION deploy \
                --role-source "$ROLE_SOURCE" \
                --playbook /tmp/deploy-test.yml \
                --host "localhost=ansible_connection=local" \
                --host-wait-initial-delay 1s \
                --host-wait-interval 2s \
                --host-wait-timeout 60s
              echo "deploy smoke test 1/4 passed (single source)"

              # 2. Multiple role sources with apply_to
              $DIFFUSION deploy \
                --role-source "${ROLE_SOURCE},name=role_a,apply_to=all" \
                --role-source "${ROLE_SOURCE},name=role_b,apply_to=all" \
                --playbook /tmp/deploy-test.yml \
                --host "localhost=ansible_connection=local" \
                --host-wait-initial-delay 1s \
                --host-wait-timeout 60s
              echo "deploy smoke test 2/4 passed (multi-source + apply_to)"

              # 3. Skip-period idempotence — second run should be skipped
              $DIFFUSION deploy \
                --role-source "$ROLE_SOURCE" \
                --playbook /tmp/deploy-test.yml \
                --host "localhost=ansible_connection=local" \
                --host-wait-initial-delay 1s \
                --host-wait-timeout 60s \
                --skip-period 1h
              $DIFFUSION deploy \
                --role-source "$ROLE_SOURCE" \
                --playbook /tmp/deploy-test.yml \
                --host "localhost=ansible_connection=local" \
                --host-wait-initial-delay 1s \
                --host-wait-timeout 60s \
                --skip-period 1h
              echo "deploy smoke test 3/4 passed (skip-period idempotence)"

              # 4. Auto-generated playbook (no --playbook flag)
              $DIFFUSION deploy \
                --role-source "${ROLE_SOURCE},name=ci_debug" \
                --host "localhost=ansible_connection=local" \
                --host-wait-initial-delay 1s \
                --host-wait-timeout 60s \
                || echo "deploy smoke test 4/4: auto-playbook exited non-zero (expected — role has no tasks); binary did not crash."

              echo "=========================================="
              echo "All smoke tests passed on ${{ matrix.os }}!"
              echo "=========================================="
            '
